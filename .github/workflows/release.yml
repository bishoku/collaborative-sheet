name: Release plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Set release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 .github/scripts/release-version.py "$TAG")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/clipboard.test.cjs
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify installable JAR and create checksum
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 .github/scripts/verify-release.py "$VERSION"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$TAG" \
            "target/sheets-confluence-dc-${VERSION}.jar" \
            "target/sheets-confluence-dc-${VERSION}.jar.sha256" \
            --verify-tag --title "Collaborative Sheets ${VERSION}" \
            --generate-notes --prerelease
